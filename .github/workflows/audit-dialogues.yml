name: Audit des dialogues

on:
  workflow_dispatch:
  push:
    paths:
      - 'refonte/**'
      - 'dialogues/**'
      - '.github/workflows/audit-dialogues.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la refonte
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Récupérer les sources françaises de référence
        uses: actions/checkout@v4
        with:
          repository: pret/pokeemerald
          ref: 8baea56025e07db971b68f88aa85370f7432383e
          path: source-pokeemerald
          persist-credentials: false
          sparse-checkout: |
            data
            src
            include
            charmap.txt
          sparse-checkout-cone-mode: false
      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile refonte/audit-dialogues.py refonte/preparer-integration.py
      - name: Tester l'injecteur sur des données artificielles
        env:
          CHARMAP_REFERENCE: source-pokeemerald/charmap.txt
        run: python3 refonte/test-injecteur.py
      - name: Tester l'export UPS et les journaux d'injection
        run: python3 refonte/test-exporter-ups.py
      - name: Tester la validation des listes de relecture
        run: python3 refonte/test-relecture.py
      - name: Générer le rapport d'audit
        run: |
          mkdir -p rapports
          python3 refonte/audit-dialogues.py --source source-pokeemerald --rapport rapports/audit.json > rapports/audit.txt
      - name: Préparer le manifeste
        run: python3 refonte/preparer-integration.py --source source-pokeemerald --sortie rapports/manifeste.json
      - name: Indexer les usages des répliques dans les sources
        run: python3 refonte/indexer-usages.py --source source-pokeemerald --manifeste rapports/manifeste.json --sortie rapports/usages.json
      - name: Contrôler l'encodage de toutes les répliques sans ROM
        run: |
          python3 - <<'PY'
          import collections, importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("injecteur", "refonte/injecter-dialogues.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          codec = mod.Codec(Path("source-pokeemerald/charmap.txt"))
          manifest = json.loads(Path("rapports/manifeste.json").read_text())
          results = []
          stats = collections.Counter()
          for row in manifest["repliques_secondaires"] + manifest["repliques_narratives"]:
              for field, source in (("origine_assembleur", True), ("texte", False)):
                  try:
                      mod.Codec.encode(codec, row[field], source)
                      stats[field + "_ok"] += 1
                  except ValueError as exc:
                      stats[field + "_a_verifier"] += 1
                      results.append({"repere": row["repere"], "champ": field, "raison": str(exc)})
          Path("rapports/encodage.json").write_text(json.dumps({"statistiques": dict(stats), "anomalies": results}, ensure_ascii=False, indent=2)+"\n")
          print("ENCODAGE", json.dumps(dict(stats), ensure_ascii=False))
          print("CAUSES", json.dumps(dict(collections.Counter((r["champ"] + ": " + r["raison"]) for r in results)), ensure_ascii=False))
          PY
      - name: Résumer les anomalies dans le journal
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("rapports/audit.json")
          if p.exists():
              a = json.loads(p.read_text())
              for c in a["cartes"]:
                  if c["manquants"]:
                      print("MANQUANTS", c["carte"], json.dumps(c["manquants"], ensure_ascii=False))
              from collections import Counter
              print("VARIABLES", dict(Counter(w["fichier"] for w in a["variables_a_verifier"])))
              for w in a["variables_a_verifier"]:
                  print("VAR", w["fichier"], w["repere"], json.dumps(w["origine"], ensure_ascii=False), json.dumps(w["refonte"], ensure_ascii=False))
              for k in ("lignes_de_plus_de_36_caracteres", "pages_de_plus_de_deux_lignes", "doublons_json", "chevauchements_narratifs", "reperes_inconnus"):
                  print(k, len(a[k]))
          PY
      - name: Publier les rapports même en cas d'erreur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-dialogues
          path: rapports/
          if-no-files-found: warn
          retention-days: 14
